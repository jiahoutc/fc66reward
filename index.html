<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FC66 Reward — 三选一保险箱</title>
<meta name="description" content="选择一个保险箱，解锁你的奖励。">
<style>
  :root{
    --bg1:#07090f; --bg2:#111520;
    --gold:#ffd36b; --rose:#ff6a6a; --blue:#6bc2ff; --vio:#a97bff;
    --text:#eaf0ff; --muted:#94a0b2;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text); font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"PingFang SC";
    background: radial-gradient(1200px 800px at 20% -10%, rgba(255,255,255,.06), transparent 50%),
                radial-gradient(1000px 700px at 120% 0%, rgba(255,255,255,.05), transparent 45%),
                linear-gradient(180deg, var(--bg1), var(--bg2));
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center; padding:20px;
    overflow-x:hidden;
  }

  /* 霓虹光带 */
  .neon{
    position:fixed; inset:-30% -30%;
    background:
      radial-gradient(500px 200px at 20% 20%, rgba(255,208,112,.12), transparent 60%),
      radial-gradient(400px 260px at 80% 10%, rgba(106,168,255,.10), transparent 60%),
      radial-gradient(600px 260px at 50% 120%, rgba(255,106,170,.10), transparent 60%);
    filter: blur(40px); pointer-events:none; z-index:0;
    animation: drift 18s linear infinite;
  }
  @keyframes drift{ to{ transform: rotate(360deg) } }

  .wrap{
    position:relative; z-index:2; width:100%; max-width:1100px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px; padding:18px; overflow:hidden;
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
    box-shadow: 0 30px 80px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .wrap::before{ content:""; position:absolute; inset:-60% -40%;
    background: conic-gradient(from 0turn, rgba(255,211,107,.06), transparent 20%, rgba(167,123,255,.06), transparent 55%, rgba(107,194,255,.06), transparent 80%);
    filter: blur(30px); z-index:0; animation: spin 16s linear infinite; opacity:.6;
  }
  @keyframes spin{ to{ transform: rotate(1turn) } }

  .top{ position:relative; z-index:2; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .brand{ display:flex; gap:12px; align-items:center; }
  .logo{
    width:48px; height:48px; border-radius:14px;
    background: radial-gradient(circle at 35% 35%, #fff6d0, var(--gold) 60%, #b07c22 100%);
    color:#170f06; font-weight:900; display:grid; place-items:center;
    box-shadow:0 0 0 2px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.45);
  }
  h1{ margin:0; font-size:20px; letter-spacing:.4px }
  .sub{ color:var(--muted); font-size:12px }

  .controls{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .btn, .ghost{
    padding:10px 16px; border-radius:12px; border:0; cursor:pointer; font-weight:800; letter-spacing:.3px;
  }
  .btn{ background: linear-gradient(90deg, var(--gold), var(--rose)); color:#160d05; box-shadow:0 14px 30px rgba(255,106,106,.25), inset 0 0 0 1px rgba(255,255,255,.25) }
  .ghost{ background: transparent; color:#fff; border:1px solid rgba(255,255,255,.15) }

  .hero{ margin:14px 0 10px; padding:12px; border:1px solid rgba(255,255,255,.08); border-radius:14px; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.2)); }
  .hero h2{ margin:0 0 6px; font-size:24px }
  .status{ color:var(--muted); font-size:13px; margin-top:6px }
  .timer{ font-weight:800; color:#111; background:var(--gold); padding:6px 10px; border-radius:10px; }

  .grid{ display:grid; gap:16px; grid-template-columns:repeat(3, minmax(160px,1fr)); }
  @media (max-width:700px){ .grid{ grid-template-columns:repeat(2,minmax(140px,1fr)); } }
  @media (max-width:480px){ .grid{ grid-template-columns:1fr 1fr; } }

  .safe{
    position:relative; padding:18px; text-align:center; border-radius:18px; cursor:pointer; user-select:none;
    background:
      radial-gradient(120px 90px at 30% 30%, rgba(255,211,107,.15), rgba(255,211,107,.06) 60%, transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.12);
    transition: transform .25s cubic-bezier(.2,.9,.2,1), box-shadow .25s, filter .25s;
    overflow:hidden;
  }
  .safe::before{
    content:""; position:absolute; inset:-100% -100%;
    background: conic-gradient(from 0turn, rgba(255,211,107,.22), rgba(255,106,170,.18), rgba(107,194,255,.18), rgba(169,123,255,.18), rgba(255,211,107,.22));
    animation: aura 3.8s linear infinite; filter: blur(26px); opacity:.5; z-index:0;
  }
  @keyframes aura{ to{ transform: rotate(1turn) } }
  .safe:hover{ transform: translateY(-6px); box-shadow: 0 22px 50px rgba(0,0,0,.55); }
  .icon{ position:relative; z-index:1; font-size:48px; text-shadow:0 0 24px rgba(255,211,107,.35); }
  .lab{ position:relative; z-index:1; margin-top:6px; color:var(--muted); font-size:13px }

  .safe.opening{ animation: tilt .8s both }
  @keyframes tilt{
    0%{ transform: perspective(700px) rotateX(0) }
    35%{ transform: perspective(700px) rotateX(14deg) translateY(-8px) scale(1.02) }
    100%{ transform: translateY(-6px) scale(1.03) }
  }
  .safe.opened{
    border-color: rgba(255,211,107,.7);
    box-shadow: 0 30px 70px rgba(255,211,107,.25), inset 0 0 0 1px rgba(255,255,255,.25);
    background: linear-gradient(180deg, rgba(255,211,107,.25), rgba(255,255,255,.08));
  }

  .result{ margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .badge{ padding:8px 12px; border-radius:999px; background:rgba(255,211,107,.15); border:1px solid rgba(255,211,107,.45); color:#ffe9a8; font-weight:700; font-size:12px; }
  .claim{ display:inline-flex; align-items:center; gap:8px; padding:12px 16px; border-radius:12px; border:1px dashed rgba(255,211,107,.6); color:#ffe9a8; text-decoration:none; font-weight:800; letter-spacing:.3px; transition: transform .2s; }
  .claim:hover{ transform: translateY(-2px) }

  /* 金币粒子画布 */
  canvas#fx{ position:fixed; inset:0; pointer-events:none; z-index:999; }
</style>
</head>
<body>
<div class="neon"></div>
<canvas id="fx"></canvas>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">FC</div>
      <div>
        <h1 id="brandTitle">FC66 Reward</h1>
        <div id="brandSub" class="sub">Pick 1 Safe • Unlock Your Bonus</div>
      </div>
    </div>
    <div class="controls">
      <span id="timer" class="timer" style="display:none"></span>
      <button id="mute" class="ghost">🔈</button>
      <button id="reset" class="ghost">重置</button>
    </div>
  </div>

  <div class="hero">
    <h2>三选一保险箱</h2>
    <div class="sub">选择任意一个，看看你的好运！</div>
    <div class="status" id="status">状态：加载配置中…</div>
  </div>

  <div id="grid" class="grid" aria-label="保险箱选择区"></div>

  <div class="result">
    <div id="badge" class="badge">等待选择</div>
    <a id="claim" class="claim" href="#" target="_blank" rel="noopener">🎁 领取奖励</a>
  </div>
</div>

<script>
(async function(){
  // ---- 轻量音效（WebAudio） ----
  const AudioKit = (function(){
    const ctx = window.AudioContext ? new AudioContext() : null;
    const play = (f=880, t=.09, type='sine', g=.06)=>{
      if(!ctx) return;
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = type; o.frequency.value = f; gn.gain.value = g;
      o.connect(gn); gn.connect(ctx.destination); o.start();
      gn.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t);
      setTimeout(()=>{ o.stop(); o.disconnect(); gn.disconnect(); }, t*1000+20);
    };
    return { play, ctx };
  })();

  // ---- 金币粒子（Canvas） ----
  const cv = document.getElementById('fx'), cx = cv.getContext('2d');
  const resize = ()=>{ cv.width = innerWidth; cv.height = innerHeight; };
  addEventListener('resize', resize); resize();
  let coins = [];
  function spawnCoins(n=160, atX=innerWidth/2, atY=innerHeight/3){
    for(let i=0;i<n;i++){
      coins.push({
        x: atX + (Math.random()-0.5)*80,
        y: atY + (Math.random()-0.5)*40,
        r: 2 + Math.random()*4,
        vx: -2 + Math.random()*4,
        vy: -6 - Math.random()*5,
        rot: Math.random()*Math.PI, vr: (Math.random()-.5)*0.3,
        life: 1
      });
    }
  }
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    coins.forEach(p=>{
      p.vy += 0.2; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.015;
      const g = cx.createLinearGradient(p.x-p.r, p.y-p.r, p.x+p.r, p.y+p.r);
      g.addColorStop(0, 'rgba(255,223,128,'+Math.max(p.life,0)+')');
      g.addColorStop(1, 'rgba(176,122,34,'+Math.max(p.life*0.9,0)+')');
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
      cx.fillStyle = g; cx.fillRect(-p.r*1.2,-p.r*0.3,p.r*2.4,p.r*0.6);
      cx.restore();
    });
    coins = coins.filter(p=>p.life>0 && p.y < cv.height+40);
    requestAnimationFrame(tick);
  }
  tick();

  // ---- DOM ----
  const grid = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const badge = document.getElementById('badge');
  const claim = document.getElementById('claim');
  const titleEl = document.getElementById('brandTitle');
  const subEl = document.getElementById('brandSub');
  const timerEl = document.getElementById('timer');
  const muteBtn = document.getElementById('mute');
  const resetBtn = document.getElementById('reset');

  let CFG=null, winner=0, boxes=[], bgm=null, isMuted=false;

  function setStatus(t){ statusEl.textContent = '状态：' + t; }
  function setBadge(t){ badge.textContent = t; }

  async function loadConfig(){
    const url = 'https://admin.fc66reward.com/config.json?ts=' + Date.now();
    try{
      const r = await fetch(url);
      CFG = await r.json();
    }catch(e){
      CFG = {
        brand:{title:'FC66 Reward',subtitle:'Pick 1 Safe • Unlock Your Bonus'},
        background:{type:'color', color:'#0a0c12'},
        music:{enabled:false, url:'', autoplay:false, volume:0.35},
        claim:{link:'#', button_text:'🎁 领取奖励'},
        event:{show_timer:false, deadline:'2025-12-31T23:59:59+08:00'},
        rewards:['Bonus A','Bonus B','Bonus C']
      };
    }

    // 品牌
    titleEl.textContent = CFG.brand?.title || 'FC66 Reward';
    subEl.textContent   = CFG.brand?.subtitle || 'Pick 1 Safe • Unlock Your Bonus';

    // 背景
    if(CFG.background?.type === 'image' && CFG.background?.image_url){
      document.body.style.backgroundImage = `url('${CFG.background.image_url}')`;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
    }else{
      document.body.style.backgroundImage = 'none';
      document.body.style.background = `linear-gradient(180deg, ${CFG.background?.color||'#07090f'}, #0e1420)`;
    }

    // 按钮/链接
    claim.href = CFG.claim?.link || '#';
    claim.textContent = CFG.claim?.button_text || '🎁 领取奖励';

    // 倒计时
    if(CFG.event?.show_timer && CFG.event?.deadline){
      timerEl.style.display = 'inline-block';
      startCountdown(new Date(CFG.event.deadline));
    }else{
      timerEl.style.display = 'none';
    }

    // 背景音乐
    if(bgm){ try{bgm.pause();}catch(e){} }
    if(CFG.music?.enabled && CFG.music?.url){
      bgm = new Audio(CFG.music.url);
      bgm.loop = true;
      bgm.volume = Math.max(0,Math.min(1, CFG.music.volume ?? 0.35));
      if(CFG.music.autoplay){ bgm.play().catch(()=>{}); }
    }else{ bgm = null; }

    render();
  }

  // 倒计时
  let tmr=null;
  function startCountdown(deadline){
    if(tmr) clearInterval(tmr);
    const pad=n=>n<10?'0'+n:n;
    const tick=()=>{
      const now = new Date(); let ms = deadline - now;
      if(ms<=0){ timerEl.textContent = '活动已结束'; return clearInterval(tmr); }
      const d=Math.floor(ms/86400000); ms%=86400000;
      const h=Math.floor(ms/3600000); ms%=3600000;
      const m=Math.floor(ms/60000); ms%=60000;
      const s=Math.floor(ms/1000);
      timerEl.textContent = `倒计时 ${d}天 ${pad(h)}:${pad(m)}:${pad(s)}`;
    };
    tick(); tmr=setInterval(tick,1000);
  }

  // 渲染保险箱
  function render(){
    grid.innerHTML=''; boxes.length=0;
    for(let i=0;i<3;i++){
      const el=document.createElement('div');
      el.className='safe';
      el.innerHTML=`<div class="icon">🔒</div><div class="lab">保险箱 ${i+1}</div>`;
      el.onclick=()=>open(i, el);
      boxes.push(el); grid.appendChild(el);
    }
    winner = Math.floor(Math.random()*3);
    setStatus('请选择一个保险箱'); setBadge('等待选择');
  }

  function pickReward(){
    const arr = Array.isArray(CFG.rewards) ? CFG.rewards.filter(Boolean) : [];
    if(!arr.length) return '奖励';
    return arr[Math.floor(Math.random()*arr.length)];
  }

  function open(i, el){
    if(el.classList.contains('opened')) return;
    el.classList.add('opening');
    setTimeout(()=>{
      el.classList.remove('opening');
      el.classList.add('opened');
      el.querySelector('.icon').textContent='📦';
      if(i===winner){
        const r = pickReward();
        setStatus('恭喜！获得 '+r);
        setBadge('中奖：'+r);
        const b = el.getBoundingClientRect();
        spawnCoins(160, b.left + b.width/2, b.top + scrollY + b.height/2);
        AudioKit.play(1200,.12,'square',.08);
        setTimeout(()=>AudioKit.play(1400,.1,'square',.07),120);
      }else{
        setStatus('没中，再试一次吧！');
        setBadge('未中奖');
        AudioKit.play(420,.1,'sawtooth',.06);
      }
    },520);
  }

  // 控件
  resetBtn.onclick = ()=>render();
  muteBtn.onclick  = ()=>{
    if(!bgm) return;
    isMuted = !isMuted; bgm.muted = isMuted;
    muteBtn.textContent = isMuted ? '🔇' : '🔈';
    if(!isMuted){ bgm.play().catch(()=>{}); }
  };

  await loadConfig();
})();
</script>
</body><script>
(async () => {
  try {
    const res = await fetch('https://admin.fc66reward.com/config.json?ts=' + Date.now());
    const cfg = await res.json();

    if (cfg?.background?.type === 'image' && cfg?.background?.image_url) {
      // 用 <style> 动态覆盖 body 背景，带 !important，确保压过原来的 linear-gradient
      const css = `
        body{
          background-image: url('${cfg.background.image_url}') !important;
          background-size: cover !important;
          background-position: center center !important;
          background-attachment: fixed !important;
          background-color: transparent !important;
        }`;
      let s = document.getElementById('dynbg');
      if (!s) { s = document.createElement('style'); s.id = 'dynbg'; document.head.appendChild(s); }
      s.textContent = css;
      console.log('[FC66] 背景已切换为图片：', cfg.background.image_url);
    } else {
      console.log('[FC66] 使用纯色背景：', cfg?.background?.color);
      // 如果你希望纯色时也覆盖旧的 gradient，可以打开下面这段：
      // const s = document.getElementById('dynbg') || Object.assign(document.createElement('style'), {id:'dynbg'});
      // s.textContent = `body{ background: ${cfg?.background?.color || '#0a0c12'} !important }`;
      // document.head.appendChild(s);
    }
  } catch (e) {
    console.warn('[FC66] 读取配置失败：', e);
  }
})();
</script>

</html>
